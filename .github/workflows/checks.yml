name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -run '^$' -fuzz '^FuzzLyrics$' -fuzztime=5s .
      - run: go test -run '^$' -fuzz '^FuzzResponse$' -fuzztime=5s .
      - run: go build ./cmd/lyricfetch
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps ./python --wheel-dir dist
      - run: python -m pip install dist/lyricfetch-*.whl pytest==9.1.1 ruff==0.16.8
      - run: python -I -m pytest -q python/tests
      - run: ruff check python tools
      - run: ruff format --check python tools
